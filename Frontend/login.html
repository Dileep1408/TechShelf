<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechShelf - Club Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-container">

            <h1>TechShelf</h1>

            <h2>Club Member Login</h2>

            <form id="login-form">

                <div>
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >
                </div>


                <div>
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >
                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p id="login-message"></p>


            <p>
                Not a club member?

                <a href="resources.html">
                    Browse Resources
                </a>
            </p>


            <p>
                <a href="index.html">
                    Back to Home
                </a>
            </p>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
